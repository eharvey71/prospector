name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The suite is deliberately dependency-light: pure-logic tests only
      # (state machine, option matching, standard answers, judge routing).
      # No Playwright, no Firebase emulator.
      - run: pip install pytest pydantic
      - name: Tests
        run: python -m pytest tests/ -q
      - name: Syntax check everything else
        run: python -m compileall -q shared functions worker
